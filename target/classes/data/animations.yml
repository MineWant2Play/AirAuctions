# AirAuctions - Animations Configuration
# Docs: https://airdevelopment.gitbook.io/docs/

# Define reusable text animations here, then reference them anywhere
# MiniMessage text is used (messages, titles, actionbars, bossbars, etc.) with:
#   <anim:key>  |  <a:key> (shorthand)
#
# 'interval' is in ticks (20 ticks = 1 second). Frames loop in order.

animations:

  rainbow:
    interval: 5
    mode: RANDOM
    frames:
      - "<red>"
      - "<gold>"
      - "<yellow>"
      - "<green>"
      - "<aqua>"
      - "<light_purple>"

  loading_dots:
    interval: 10
    mode: LOOP
    frames:
      - "Loading"
      - "Loading."
      - "Loading.."
      - "Loading..."

  auction_wave:
    interval: 4
    mode: PING_PONG
    frames:
      - "<white>A</white><gray>uction</gray>"
      - "<gray>A</gray><white>u</white><gray>ction</gray>"
      - "<gray>Au</gray><white>c</white><gray>tion</gray>"
      - "<gray>Auc</gray><white>t</white><gray>ion</gray>"
      - "<gray>Auct</gray><white>i</white><gray>on</gray>"
      - "<gray>Aucti</gray><white>o</white><gray>n</gray>"
      - "<gray>Auctio</gray><white>n</white>"