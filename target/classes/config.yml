# AirAuctions - Main Configuration
# Docs: https://airdevelopment.gitbook.io/docs/

# --------------------------------------------------
# GENERAL
# --------------------------------------------------
general:
  lang: "en_US"                      # File name under lang/messages/<KEY>.yml
  items-lang: "en_US"                # File name under lang/items/<KEY>.yml
  notify-updates: true               # Notify admins on join when a new plugin version is available
  console-feedback: true             # Send feedback to players when console runs commands targeting them
  strict-args: true                  # Show an error if extra arguments are passed to a command

# --------------------------------------------------
# FORMATTING
# --------------------------------------------------
formatting:

  # How durations are displayed in placeholders.
  # DETAILED    - "2 days 3 hours 4 minutes 36 seconds"
  # SEQUENTIAL  - One unit at a time, largest first
  # CUSTOM      - Up to <granularity> units
  duration:
    mode: CUSTOM
    granularity: 2    # 1 = only the largest unit, 4 = full breakdown

  # Time pattern used in placeholders.
  # HH:mm          -> 14:05
  # hh:mm a        -> 02:05 PM
  time: "HH:mm"

  # Date pattern used in placeholders.
  # dd/MM/yy       -> 08/03/26
  # dd MMM         -> 08 Mar
  # MMMM dd, yyyy  -> March 08, 2026
  # E, dd MMM      -> Sun, 08 Mar
  date: "dd/MM/yy"

  # Zone both 'clock' and 'date' above are computed against.
  # Use a valid IANA zone id (https://timeapi.io/documentation/iana-timezones),
  # or "system" to use the JVM's default zone.
  timezone: "system"

# --------------------------------------------------
# LISTINGS  (shared by both auctions and bids)
# --------------------------------------------------
listings:

  # --- Limits ---
  max-active: 3                      # Max active listings per player. Bypass: airauctions.bypass.limit.<number>
  max-history: 150                   # Max entries shown in the history GUI per player. -1 = unlimited
  max-expired: 50                    # Max entries allowed in the expired GUI per player. -1 = unlimited.
  cooldown: 5                        # Seconds between listings per player. -1 = disabled. Bypass: airauctions.bypass.cooldown

  # --- Item amount ---
  # Controls how /ah sell and /ah bid handle the optional [amount] argument.
  # REQUIRED  - argument must always be provided
  # OPTIONAL  - argument may be omitted; defaults to the full held stack
  # DISABLED  - argument is never accepted; always uses the full held stack
  amount-mode: OPTIONAL
  min-amount: 1                      # Minimum items per listing. -1 or 1 = no minimum

  # --- Lifecycle ---
  drop-on-full-inventory: false      # Drop items at the player's feet if their inventory is full
  instant-cancel: false              # Return canceled items immediately instead of routing through expired GUI
  expired-purge-delay: 604800        # Seconds before an expired listing is purged from the expired GUI. -1 = disabled
  sweep-interval: 5                  # Seconds between expiry sweeps for auctions and bids

  # --- Deletion ---
  require-delete-confirmation: true  # Require confirmation before a listing is deleted
  delete-confirmation-timeout: 60    # Seconds before an unconfirmed deletion request expires. -1 = never.
                                     # Only used as a fallback when confirm/delete.yml has 'enabled: false'.

  # --- Sort options ---
  # Order here controls the cycle order in GUIs.
  sort:
    active:
      newest_date: "Newest Date"
      oldest_date: "Oldest Date"
      highest_price: "Highest Price"
      lowest_price: "Lowest Price"
      alphabetical: "Alphabetical"
      amount: "Amount"

    # Applies to both 'expired' and 'storage' GUIs
    unclaimed:
      purges_soonest: "Purges Soonest"
      purges_latest: "Purges Latest"
      highest_price: "Highest Price"
      lowest_price: "Lowest Price"
      alphabetical: "Alphabetical"
      amount: "Amount"

    history:
      newest_transaction: "Newest Transaction"
      oldest_transaction: "Oldest Transaction"
      highest_price: "Highest Price"
      lowest_price: "Lowest Price"
      alphabetical: "Alphabetical"
      amount: "Amount"

  # --- Filter options ---
  # Order here controls the cycle order in GUIs.
  # Additional filters are configured in expansions.yml and filter.yml.
  filter:
    type:
      all: "All"
      auctions: "Auctions"
      bids: "Bids"

# --------------------------------------------------
# AUCTIONS
# --------------------------------------------------
auctions:

  # --- Limits ---
  allow-self-purchase: false         # Allow the seller to purchase their own listing

  # --- Lifetime ---
  lifetime: 86400                    # Seconds before an unsold listing expires. -1 = never. Bypass: airauctions.bypass.expire-time.<seconds>

  # --- Listing flow ---
  require-confirmation: true         # Require the seller to confirm before the listing goes live
  confirmation-timeout: 60           # Seconds before an unconfirmed listing is discarded. -1 = never
                                     # Only used as a fallback when confirm/auction.yml has 'enabled: false'.
  announce-to-seller: false          # Send the global broadcast to the seller as well

# --------------------------------------------------
# BIDS
# --------------------------------------------------
bids:

  # --- Limits ---
  allow-self-bidding: false          # Allow the seller to bid on their own listing
  min-increment: 5                   # Minimum amount a new bid must exceed the current highest
  max-increment: 100000              # Maximum allowed bid increment. -1 = no limit

  # --- Duration ---
  min-duration: 60                   # Minimum bid listing duration in seconds
  max-duration: 3600                 # Maximum bid listing duration in seconds. -1 = unlimited. Bypass: airauctions.bypass.duration-time.<seconds>
  default-duration: 300              # Duration used when none is specified in the command

  # --- Listing flow ---
  require-confirmation: true         # Require the seller to confirm before the listing goes live
  confirmation-timeout: 60           # Seconds before an unconfirmed listing is discarded. -1 = never
                                     # Only used as a fallback when confirm/bid.yml has 'enabled: false'.
  announce-to-seller: false          # Send the global broadcast to the seller as well

  # --- Sniper protection ---
  # If a bid arrives within the final <snipe-window> seconds, the listing is
  # extended by <snipe-extend> seconds to give other bidders time to respond.
  snipe-extend: 20                   # Seconds added to the listing when a snipe is detected. -1 = disabled
  snipe-window: 5                    # Seconds from expiry within which a bid is considered a snipe

  # --- Won items ---
  instant-collect: false             # Deliver won items immediately, bypassing the storage GUI
  collect-purge-delay: 604800        # Seconds before an uncollected won item is purged from storage GUI. -1 = never
  max-uncollected: 10                # Max uncollected won items before a player must collect before bidding again. -1 = unlimited

# --------------------------------------------------
# NOTIFICATIONS
# --------------------------------------------------
notifications:
  enabled: true
  join-delay: 40                     # Ticks after join before showing pending offline messages. -1 = disabled. 20 ticks = 1 second
  repeat-times: 3                    # Number of separate joins the uncollected won bids reminder is shown on. -1 = unlimited.
                                     # Resets once the player collects everything.

# --------------------------------------------------
# RESTRICTIONS
# --------------------------------------------------
restrictions:

  # --- Gamemodes & worlds ---
  blocked-gamemodes: []              # Players in these gamemodes cannot create listings or place bids. Bypass: airauctions.bypass.gamemodes
  # - CREATIVE
  # - SPECTATOR

  blocked-worlds: []                 # Players in these worlds cannot create listings or place bids. Bypass: airauctions.bypass.worlds
  # - "world_name"

  # --- Items ---
  allow-damaged-items: true          # Allow items with durability damage to be listed. Bypass: airauctions.bypass.damaged-items
  max-search-length: 32              # Maximum characters allowed in a search query

  # --- Blacklist ---
  # Prevents matched items from being listed.
  # Set as-whitelist: true to invert - only matched items will be allowed.
  # Bypass: airauctions.bypass.blacklist
  blacklist:
    as-whitelist: false

    materials: []                    # Bukkit material name
    # - BEDROCK

    names: []                        # Display name substring (color-code-insensitive)
    # - "Soulbound Item"

    lores: []                        # Lore line substring (color-code-insensitive)
    # - "Not for Sale"

    enchantments: []                 # Format: "ENCHANT_NAME" or "ENCHANT_NAME:LEVEL"
    # - "BINDING_CURSE"
    # - "UNBREAKING:3"

    nbt-keys: []                     # Match by NBT key presence
    # - "undroppable"

    custom-model-data: []            # Format: "DATA" or "MATERIAL:DATA"
    # - "1005"
    # - "PAPER:1006"

    item-models: []                  # Item model key (1.21.4+). Format: "namespace:path"
    # - "namespace:path/model"

    plugin-items: []                 # Nexo, ItemsAdder, or CraftEngine item ID
    # - "nexo:item_id"
    # - "itemsadder:namespace:item_id"
    # - "craftengine:namespace:item_id"