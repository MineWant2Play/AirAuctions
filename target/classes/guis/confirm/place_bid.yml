# AirAuctions - confirm/place_bid.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# contexts:
#   Override any combination of fields for a specific source GUI.
#   Key = the GUI id that triggered the confirmation (e.g. target/active).

settings:
  # If disabled, it will fallback to INPUT instead of opening this GUI.
  enabled: true
  title: "<gradient:#5AD1F2:#736EFE><bold>Place Bid</bold></gradient>"
  rows: 4

# --------------------------------------------------
# LAYOUT
# Controls how the listing is displayed.
# --------------------------------------------------
layout:
  # Slots where targeted listing is rendered.
  listing-slots: 13

  # How the targeted listing is rendered inside listing-slots.
  listing:
    lore:
      - "%item_lore%"
      - "=has:airauctions.command.delete <dark_gray>#%id% (Listed @ %date% %time%)"
      - " "
      - "<dark_gray>Bid Information"
      - "<dark_gray> - <gray>Seller: <white>%seller%"
      - "<dark_gray> - <gray>Starting price: %price% (%economy%)"
      - "<dark_gray> - <gray>Amount: <white>x%amount%"
      - "<dark_gray> - <gray>Category: <white>%category%"
      - " "
      - "<dark_gray> - <gray>Total bidders: <white>%total_bidders%"
      - "<dark_gray> - <gray>Highest bidder: <white>%highest_bidder%"
      - "<dark_gray> - <gray>Current offer: %highest_offer%"
      - "<dark_gray> - <gray>Duration: <white>%duration%"
      - "!=is:owned  "
      - "!=is:owned <dark_gray> - <gray>Your offer: %your_offer%"
    item-flags:
      - HIDE_ATTRIBUTES

# --------------------------------------------------
# ITEMS (base - used when no context overrides items)
# Define the static items rendered in this GUI.
# --------------------------------------------------
items:
  confirm:
    slots: 11
    priority:
      - conditions:
          - "%valid_min_offer% == false"
        material: RED_STAINED_GLASS_PANE
        display-name: "<red><bold>Invalid Bid</bold>"
        lore:
          - "<gray>Your bid must be at least %min_offer%."
      - conditions:
          - "%can_afford_offer% == false"
        material: RED_STAINED_GLASS_PANE
        display-name: "<red><bold>Not Enough Funds</bold>"
        lore:
          - "<gray>You cannot afford to bid <red>%offer_plain%</red>."
      - conditions:
          - "%valid_max_offer% == false"
        material: RED_STAINED_GLASS_PANE
        display-name: "<red><bold>Invalid Bid</bold>"
        lore:
          - "<gray>Your bid cannot exceed %max_offer%."
      - conditions:
          - "%valid_min_offer% == true"
          - "%can_afford_offer% == true"
          - "%valid_max_offer% == true"
        material: LIME_STAINED_GLASS_PANE
        display-name: "<green><bold>Confirm</bold>"
        lore:
          - "<gray>Click to confirm this bid."
          - " "
          - "<dark_gray>- <gray>Your offer: %your_offer%"
        actions:
          any:
            - "[bid]"
            - "=can:bid =is:valid [sound] $success"
            - "[open] context:true"

  cancel:
    slots: 15
    material: RED_STAINED_GLASS_PANE
    display-name: "<red><bold>Cancel</bold>"
    lore:
      - "<gray>Click to cancel and go back."
    actions:
      any:
        - "[open] context:true"
        - "[sound] $deny"

  # --- Footer ---
  add-1:
    slots: 27
    material: LIME_STAINED_GLASS_PANE
    display-name: "<green><bold>+1</bold>"
    lore:
      - "<gray>Add <green>+1</green> to the current offer."
    actions:
      any:
        - "[amount] +1"
        - "=is:valid [sound] $click"
        - "!=is:valid [open] context:true"

  add-10:
    slots: 28
    material: LIME_STAINED_GLASS_PANE
    amount: 2
    display-name: "<green><bold>+10</bold>"
    lore:
      - "<gray>Add <green>+10</green> to the current offer."
    actions:
      any:
        - "[amount] +10"
        - "=is:valid [sound] $click"
        - "!=is:valid [open] context:true"

  add-100:
    slots: 29
    material: LIME_STAINED_GLASS_PANE
    amount: 3
    display-name: "<green><bold>+100</bold>"
    lore:
      - "<gray>Add <green>+100</green> to the current offer."
    actions:
      any:
        - "[amount] +100"
        - "=is:valid [sound] $click"
        - "!=is:valid [open] context:true"

  set-offer:
    slots: 31
    material: EXPERIENCE_BOTTLE
    display-name: "<aqua><bold>Set Offer"
    lore:
      - "<gray>Click to set a custom offer."
    actions:
      any:
        - "[amount]"
        - "=is:valid [sound] $click"
        - "!=is:valid [open] context:true"
    priority:
      - conditions:
          - "%economy_id% == vault"
        material: EMERALD

  remove-1:
    slots: 33
    material: RED_STAINED_GLASS_PANE
    display-name: "<red><bold>-1</bold>"
    lore:
      - "<gray>Remove <red>-1</red> to the current offer."
    actions:
      any:
        - "[amount] -1"
        - "=is:valid [sound] $click"
        - "!=is:valid [open] context:true"

  remove-10:
    slots: 34
    material: RED_STAINED_GLASS_PANE
    amount: 2
    display-name: "<red><bold>-10</bold>"
    lore:
      - "<gray>Remove <red>-10</red> to the current offer."
    actions:
      any:
        - "[amount] -10"
        - "=is:valid [sound] $click"
        - "!=is:valid [open] context:true"

  remove-100:
    slots: 35
    material: RED_STAINED_GLASS_PANE
    display-name: "<red><bold>-100</bold>"
    lore:
      - "<gray>Remove <red>-100</red> to the current offer."
    amount: 3
    actions:
      any:
        - "[amount] -100"
        - "=is:valid [sound] $click"
        - "!=is:valid [open] context:true"

# --------------------------------------------------
#  GUI CONTEXTS
#  Override any field based on which GUI triggered the overlay.
#  Keys must exactly match the source GUI id.
# --------------------------------------------------
contexts:
  target/active:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Place Bid</bold></gradient> <dark_gray>- <white>%seller%'s Listing"

    # The rest is inherited from the base config above unless overridden here.

  target/active|browsing/view_bid:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Place Bid</bold></gradient> <dark_gray>- <white>%seller%'s Listing (Bid Details)"

  target/active|browsing/search:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Place Bid</bold></gradient> <dark_gray>- <white>%seller%'s Listing <dark_gray>- <white>\"%query%\""

  target/active|browsing/search|browsing/view_bid:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Place Bid</bold></gradient> <dark_gray>- <white>%seller%'s Listing (Bid Details) <dark_gray>- <white>\"%query%\""

  browsing/search:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Place Bid</bold></gradient> <dark_gray>- <white>\"%query%\""

  browsing/search|browsing/view_bid:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Place Bid</bold></gradient> <dark_gray>- <white>\"%query%\" (Bid Details)"