# AirAuctions - browsing/categories.yml
# Docs: https://airdevelopment.gitbook.io/docs/

settings:
  # When disabled, /ah skips this GUI and opens 'browsing/global' GUI directly.
  enabled: true
  title: "<gradient:#5AD1F2:#736EFE><bold>Categories</bold></gradient>"
  rows: 6

# --------------------------------------------------
# ITEMS
# Static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [0-7, 9, 17, 18, 26, 27, 35, 36, 44-53]

  # --- Header ---
  close:
    template: close-button
    slots: 8

  # --- Categories ---
  category-all:
    slots: 13
    display-name: "<aqua><bold>All Listings</bold>"
    lore:
      - "<dark_gray>Browse"
      - " "
      - "<gray>View every active listing"
      - "<gray>across all categories."
      - " "
      - "<aqua>Click <gray>to browse"
    actions:
      any:
        - "[sound] $click"
        - "[open] gui:browsing/global filter:category:all"
    item-flags:
      - HIDE_ATTRIBUTES
    animation:
      interval: 20
      loop: true
      frames:
        - material: NETHERITE_SWORD
        - material: DIAMOND_PICKAXE
        - material: COOKED_BEEF
        - material: NETHER_WART
        - material: PIG_SPAWN_EGG
        - material: CRAFTING_TABLE
        - material: REDSTONE_BLOCK
        - material: GRASS_BLOCK
        - material: CYAN_WOOL
        - material: BRICKS

  category-combat:
    slots: 28
    material: NETHERITE_SWORD
    display-name: "<aqua><bold>Combat & Defense</bold>"
    lore:
      - "<dark_gray>Weapons & Armor"
      - " "
      - "<gray>Swords, bows, armor and"
      - "<gray>related combat equipment."
      - " "
      - "<aqua>Click <gray>to browse"
    actions:
      any:
        - "[sound] $click"
        - "[open] gui:browsing/global filter:category:combat"
    item-flags:
      - HIDE_ATTRIBUTES

  category-tools:
