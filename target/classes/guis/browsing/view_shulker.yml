# AirAuctions - browsing/view_shulker.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# contexts:
#   Override any combination of fields for a specific source GUI.
#   Key = the GUI id that triggered the search (e.g. target/active).

settings:
  title: "<gradient:#5AD1F2:#736EFE><bold>Shulker Contents</bold></gradient>"
  rows: 6

# --------------------------------------------------
# LAYOUT
# Controls how listing is displayed.
# --------------------------------------------------
layout:
  # Slots where the target listing is displayed.
  listing-slots: 4

  # How the listing is rendered inside listing-slots.
  listing:
    template: card-active

  # Slots where the shulker box contents are displayed.
  shulker-slots: [18-44]

# --------------------------------------------------
# ITEMS
# Define the static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [9-17, 45-53]

  back:
    slots: 0
    material: DARK_OAK_DOOR
    display-name: "<white><bold>Back</bold>"
    lore:
      - "<gray>Return to the previous menu."
    actions:
      any:
        - "[open] context:true"
        - "[sound] $click"

# --------------------------------------------------
# GUI CONTEXTS
# Override any field based on which GUI triggered the preview.
# Keys must exactly match the source GUI id.
# --------------------------------------------------
contexts:
  target/active:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Shulker Contents</bold></gradient> <dark_gray>- <white>%seller%'s Listing"

    # The rest is inherited from the base config above unless overridden here.

  target/active|browsing/search:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Shulker Contents</bold></gradient> <dark_gray>- <white>%seller%'s Listing <dark_gray>- <white>\"%query%\""

  target/expired:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Shulker Contents</bold></gradient> <dark_gray>- <white>%seller%'s Expired Listing"

    layout:
      listing:
        template: card-expired

  target/expired|browsing/search:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Shulker Contents</bold></gradient> <dark_gray>- <white>%seller%'s Expired Listing <dark_gray>- <white>\"%query%\""

    layout:
      listing:
        template: card-expired

  target/history:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Shulker Contents</bold></gradient> <dark_gray>- <white>%seller%'s History"

    layout:
      listing:
        purchase:
          template: card-history-purchase
        sale:
