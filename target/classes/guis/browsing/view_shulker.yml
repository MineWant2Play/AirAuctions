      title: "<gradient:#5AD1F2:#736EFE><bold>Shulker Contents</bold></gradient> <dark_gray>- <white>%seller%'s Storage <dark_gray>- <white>\"%query%\""

    layout:
      listing:
        template: card-storage

  player/active:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Shulker Contents</bold></gradient> <dark_gray>- <white>Your Listing"

  player/active|browsing/search:
