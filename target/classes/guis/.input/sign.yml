# AirAuctions - input/sign.yml Configuration
# Docs: https://airdevelopment.gitbook.io/docs/

# This input type requires version 1.21.7+ to work.

# NOTE: there is no 'on-cancel' here (unlike chat.yml/dialog.yml). Due to a Minecraft client
# limitation, pressing ESC and pressing Done with an empty line can't be told apart, so a sign
# prompt always just returns to the previous GUI.

# -----------------------------------------------
# CONTEXTS
# Each action that opens a sign input names a context.
# Line 0 is always reserved for player input.
# Lines 1-3 are static decoration text.
# -----------------------------------------------
contexts:
  search:
    lines:
      1: "^ Search ^"
      # 2: "----------"

  quantity:
    lines:
      1: "^ Quantity ^"

  bid:
    lines:
      1: "^ Bid ^"

  price:
    lines:
      1: "^ Price ^"

  initial-price:
    lines:
      1: "^ Initial price ^"