# AirAuctions - input/dialog.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# This input type requires version 1.21.6+ to work.

# -----------------------------------------------
# GLOBAL
# Applies to all contexts unless overridden.
# -----------------------------------------------
on-cancel: BACK   # BACK = reopen previous GUI | CLOSE = do nothing

# -----------------------------------------------
# CONTEXTS
# Each action that opens a dialog input names a context.
# on-cancel can be overridden per context.
# -----------------------------------------------
contexts:
  search:
    # on-cancel: CLOSE
    title: "Search"
    external-title: "AirAuctions"
    width: 200
    can-close: true

    body:
      entries:
        - type: text
          text: "Enter the name of the item you are looking for."
        # - type: item
        #   material: COMPASS
        #   description: "<gray>Searching the browse"
        #   description-width: 150
        #   show-tooltip: true
        #   width: 16
        #   height: 16

    input:
      label: "Item name"
      label-visible: true
      initial-value: ""
      max-length: 32  # -1 (or omitted) = unlimited
      width: 150

    buttons:
      submit:
        text: "<green>Search"
        width: 100
      cancel:
        text: "<red>Cancel"
        width: 100

  quantity:
    title: "Quantity"
    external-title: "AirAuctions"
    width: 200
    can-close: true

    body:
      entries:
        - type: text
          text: "Enter the quantity you wish to purchase."
    input:
      label: "Quantity"
      label-visible: true
      initial-value: ""
      width: 150

    buttons:
      submit:
        text: "<green>Confirm"
        width: 100
      cancel:
        text: "<red>Cancel"
        width: 100

  bid:
    title: "Bid"
    external-title: "AirAuctions"
    width: 200
    can-close: true

    body:
      entries:
        - type: text
          text: "Enter your bid amount."

    input:
      label: "Bid amount"
      label-visible: true
      initial-value: ""
      width: 150

    buttons:
      submit:
        text: "<green>Place Bid"
        width: 100
      cancel:
        text: "<red>Cancel"
        width: 100

  price:
    title: "Price"
    external-title: "AirAuctions"
    width: 200
    can-close: true

    body:
      entries:
        - type: text
          text: "Enter a price for your listing."

    input:
      label: "Listing price"
      label-visible: true
      initial-value: ""
      width: 150

    buttons:
      submit:
        text: "<green>Set Price"
        width: 100
      cancel:
        text: "<red>Cancel"
        width: 100

  initial-price:
    title: "Initial Price"
    external-title: "AirAuctions"
    width: 200
    can-close: true

    body:
      entries:
        - type: text
          text: "Enter an initial price for your listing."

    input:
      label: "Listing initial price"
      label-visible: true
      initial-value: ""
      width: 150

    buttons:
      submit:
        text: "<green>Set Price"
        width: 100
      cancel:
        text: "<red>Cancel"
        width: 100