# AirAuctions - Storage Configuration
# Docs: https://airdevelopment.gitbook.io/docs/
#
# - This file is SERVER-SPECIFIC and is never synced.
# - Every server in the network needs its own copy.
# - Changes require a full server restart to take effect.

# --------------------------------------------------
# SERVER
# --------------------------------------------------

# Unique identifier for this server instance.
# Leave it empty to auto-generate one on first startup - the generated
# id is saved to data/.server-id.
server-id: ""

# --------------------------------------------------
# DATABASE
# --------------------------------------------------
database:

  # SQLITE   - file-based, no additional setup required
  # MYSQL    - requires a MySQL 8.0+ server
  # MARIADB  - uses the MySQL connector, compatible driver
  # MONGODB  - requires a MongoDB 5.0+ server (standalone, replica set, or Atlas)
  driver: SQLITE

  # AUTO_INCREMENT - integer IDs (simpler for players, e.g. /ah delete 42)
  # UUID           - random hex id, length below (recommended for multiserver setups)
  #
  # Note for MongoDB: AUTO_INCREMENT still works fine, but it's a bit slower
  # than UUID, since every new listing needs one extra step to look up its
  # number. If your server lists a lot of items and is on MongoDB, UUID
  # will perform better.
  listing-id-format: AUTO_INCREMENT

  # Length of the generated id when listing-id-format is UUID. Ignored otherwise.
  # Must be between 4 and 32.
  uuid-length: 8

  # Prefix applied to all plugin tables across all drivers. When sharing
  # a database across servers, this must be identical on all of them.
  table-prefix: "aa_"

  sqlite:
    file: "data/database.db"

  mysql:
    host: "localhost"
    port: 3306
    database: "airauctions"
    user: "root"
    password: ""
    ssl: false
    auto-reconnect: true

    pool:
      size: 5
      name: "AirAuctions-Pool"          # Internal HikariCP pool label, shown in thread names and logs
      connection-timeout: 30000         # ms before giving up acquiring a connection
      idle-timeout: 600000              # ms a connection can sit idle before being released
      max-lifetime: 1800000             # ms before a connection is retired and replaced

  mongodb:
    # Full connection URI (e.g. mongodb+srv://user:pass@cluster.mongodb.net).
    uri: ""

    host: "localhost"
    port: 27017
    database: "airauctions"
    user: ""
    password: ""
    auth-source: "admin"                # Database the user's credentials are defined against
    ssl: false

    pool:
      min-size: 0
      max-size: 5
      connect-timeout: 10000            # ms before giving up establishing a connection
      server-selection-timeout: 5000    # ms before giving up finding a suitable server
      idle-timeout: 600000              # ms a connection can sit idle before being released
      max-lifetime: 1800000             # ms before a connection is retired and replaced

# --------------------------------------------------
# REDIS
# Required for cross-server cache sync and real-time
# actions across a BungeeCord/Velocity network.
# --------------------------------------------------
redis:
  enabled: false
  host: "localhost"
  port: 6379
  password: ""
  database: 0
  timeout: 3000                         # ms before a Redis operation times out
  pool-size: 4                          # Number of connections held in the Redis connection pool
  resync-interval: 60                   # Seconds between full cache resyncs from the database.