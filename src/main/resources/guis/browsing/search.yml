# AirAuctions - browsing/search.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# contexts:
#   Override any combination of fields for a specific source GUI.
#   Key = the GUI id that triggered the confirmation (e.g. target/active).

settings:
  title: "<gradient:#5AD1F2:#736EFE><bold>Search</bold></gradient> <dark_gray>- <white>\"%query%\" <dark_gray>(%page%/%pages%)"
  rows: 5

# --------------------------------------------------
# LAYOUT
# Controls how listings are displayed.
# --------------------------------------------------
layout:
  filters:
    # Filters excluded from this GUI.
    excluded: [] # category, type, economy

    format:
      category: # %filter_CATEGORY_list%
        selected: "<aqua>> <white>%name% <gray>(%count%)"
        unselected: "<dark_gray>  %name% <gray>(%count%)"
      type: # %filter_TYPE_list%
        selected: "<aqua>> <white>%name% <gray>(%count%)"
        unselected: "<dark_gray>  %name% <gray>(%count%)"
      economy: # %filter_ECONOMY_list%
        selected: "<aqua>> <white>%name% <gray>(%count%)"
        unselected: "<dark_gray>  %name% <gray>(%count%)"

  sorts:
    # Sort options excluded from this GUI.
    excluded: [] # active, unclaimed, history

    format:
      active: # %sort_ACTIVE_list%
        selected: "<aqua>> <white>%name%"
        unselected: "<dark_gray>  %name%"
      unclaimed: # %sort_UNCLAIMED_list%
        selected: "<aqua>> <white>%name%"
        unselected: "<dark_gray>  %name%"
      history: # %sort_HISTORY_list%
        selected: "<aqua>> <white>%name%"
        unselected: "<dark_gray>  %name%"

  # Slots where listings are rendered.
  listing-slots: [9-35]

  # How each listing is rendered inside listing-slots.
  listing:
    template: row-market

# --------------------------------------------------
# ITEMS (base - used when no context overrides items)
# Static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [1-2, 6-8, 37-38, 42-43]

  no-results:
    template: no-listings
    slots: 22

  # --- Header ---
  back:
    slots: 0
    material: DARK_OAK_DOOR
    display-name: "<white><bold>Back</bold>"
    lore:
      - "<gray>Return to the previous menu."
    actions:
      any:
        - "[sound] $click"
        - "[open] context:true"
    priority:
      # No screen to return to when this GUI was opened directly (e.g. /ah search)
      - conditions:
          - "%previous_gui% == null"
        actions:
          any:
            - "[sound] $click"
            - "[open] gui:browsing/global"

  filter-category:
    template: filter-category
    slots: 3

  filter-type:
    template: filter-type
    slots: 4

  filter-economy:
    template: filter-economy
    slots: 5

  # --- Footer ---
  next-page:
    template: next-page
    slots: 44

  previous-page:
    template: previous-page
    slots: 36

  info:
    template: info-button
    slots: 40
    material: OAK_SIGN
    display-name: "<aqua><bold>Listing Results</bold>"

  search:
    template: search-button
    slots: 39

  sort:
    template: sort-active
    slots: 41

# --------------------------------------------------
# GUI CONTEXTS
# Override any field based on which GUI triggered the preview.
# Keys must exactly match the source GUI id.
# --------------------------------------------------
contexts:
  player/active:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Your Listings</bold></gradient> <dark_gray>- <white>\"%query%\" <dark_gray>(%page%/%pages%)"

    layout:
      listing:
        template: row-active

  target/active:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>%seller%'s Listings</bold></gradient> <dark_gray>- <white>\"%query%\" <dark_gray>(%page%/%pages%)"

    layout:
      listing:
        template: row-active

  player/expired:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Expired Listings</bold></gradient> <dark_gray>- <white>\"%query%\" <dark_gray>(%page%/%pages%)"

    layout:
      filters:
        excluded: [category, economy, type]

      listing:
        template: row-expired

    items:
      filler:
        template: filler
        slots: [1-8, 37-38, 43]

      claim-all:
        slots: 42
        priority:
          - conditions:
              - "%total% == 0"
            material: CAULDRON
            display-name: "<white><bold>Claim All</bold>"
            lore:
              - "<dark_gray>Bulk Action"
              - " "
              - "<red>You have nothing to claim yet."
          - conditions:
              - "%total% > 0"
            material: CAULDRON
            display-name: "<white><bold>Claim All</bold>"
            lore:
              - "<dark_gray>Bulk Action"
              - " "
              - "<gray>Claim all of your <white>filtered</white> expired listings at once."
              - " "
              - "<white>Click <gray>to claim all"
            actions:
              any:
                - "=can:claim [sound] $click"
                - "[confirm:claim_all] filtered:true"

      sort-unclaimed:
        slots: 41
        template: sort-unclaimed

  target/expired:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>%seller%'s Expired Listings</bold></gradient> <dark_gray>- <white>\"%query%\" <dark_gray>(%page%/%pages%)"

    layout:
      filters:
        excluded: [category, economy, type]

      listing:
        template: row-expired

    items:
      filler:
        template: filler
        slots: [1-8, 37-38, 42-43]

      sort-unclaimed:
        slots: 41
        template: sort-unclaimed

  player/history:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>History</bold></gradient> <dark_gray>- <white>\"%query%\" <dark_gray>(%page%/%pages%)"

    layout:
      filters:
        excluded: [category, economy, type]

      listing:
        purchase:
          template: row-history-purchase
        sale:
          template: row-history-sale

    items:
      filler:
        template: filler
        slots: [1-8, 37-38, 42-43]

      sort-history:
        slots: 41
        template: sort-history

  target/history:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>%seller%'s History</bold></gradient> <dark_gray>- <white>\"%query%\" <dark_gray>(%page%/%pages%)"

    layout:
      filters:
        excluded: [category, economy, type]

      listing:
        purchase:
          template: row-history-purchase
        sale:
          template: row-history-sale

    items:
      filler:
        template: filler
        slots: [1-8, 37-38, 42-43]

      sort-history:
        slots: 41
        template: sort-history

  player/storage:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Storage</bold></gradient> <dark_gray>- <white>\"%query%\" <dark_gray>(%page%/%pages%)"

    layout:
      filters:
        excluded: [category, economy, type]

      listing:
        template: row-storage

    items:
      filler:
        template: filler
        slots: [1-8, 37-38, 43]

      claim-all:
        slots: 42
        priority:
          - conditions:
              - "%total% == 0"
            material: CAULDRON
            display-name: "<white><bold>Collect All</bold>"
            lore:
              - "<dark_gray>Bulk Action"
              - " "
              - "<red>You have nothing to collect yet."
          - conditions:
              - "%total% > 0"
            material: CAULDRON
            display-name: "<white><bold>Collect All</bold>"
            lore:
              - "<dark_gray>Bulk Action"
              - " "
              - "<gray>Collect all of your <white>filtered</white> items at once."
              - " "
              - "<white>Click <gray>to collect all"
            actions:
              any:
                - "=can:collect [sound] $click"
                - "[confirm:collect_all] filtered:true"

      sort-unclaimed:
        slots: 41
        template: sort-unclaimed

  target/storage:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>%seller%'s Storage</bold></gradient> <dark_gray>- <white>\"%query%\" <dark_gray>(%page%/%pages%)"

    layout:
      filters:
        excluded: [category, economy, type]

      listing:
        template: row-storage

    items:
      filler:
        template: filler
        slots: [1-8, 37-38, 42-43]

      sort-unclaimed:
        slots: 41
        template: sort-unclaimed

  browsing/global:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Search</bold></gradient> <dark_gray>- <white>\"%query%\" <dark_gray>(%page%/%pages%)"