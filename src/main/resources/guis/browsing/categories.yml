# AirAuctions - browsing/categories.yml
# Docs: https://airdevelopment.gitbook.io/docs/

settings:
  # When disabled, /ah skips this GUI and opens 'browsing/global' GUI directly.
  enabled: true
  title: "<gradient:#5AD1F2:#736EFE><bold>Categories</bold></gradient>"
  rows: 5

# --------------------------------------------------
# ITEMS
# Static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [1-3, 5-8, 36-44]

  # --- Header ---
  close:
    slots: 0
    material: RED_STAINED_GLASS_PANE
    display-name: "<red><bold>Close</bold>"
    lore:
      - "<gray>Return to game."
    actions:
      any:
        - "[sound] $click"
        - "[close]"

  # --- Categories ---
  category-all:
    slots: 4
    display-name: "<aqua><bold>All Listings</bold>"
    lore:
      - "<dark_gray>Browse"
      - " "
      - "<gray>View every active listing"
      - "<gray>across all categories."
      - " "
      - "<aqua>Click <gray>to browse"
    actions:
      any:
        - "[sound] $click"
        - "[open] gui:browsing/global filter:category:all"
    item-flags:
      - HIDE_ATTRIBUTES
    animation:
      interval: 20
      loop: true
      frames:
        - material: NETHERITE_SWORD
        - material: COOKED_BEEF
        - material: COBBLESTONE
        - material: ENDER_PEARL

  category-gear:
    slots: 19
    material: NETHERITE_SWORD
    display-name: "<aqua><bold>Gear</bold>"
    lore:
      - "<dark_gray>Weapons & Armor"
      - " "
      - "<gray>Swords, bows, armor and"
      - "<gray>related gear equipment."
      - " "
      - "<aqua>Click <gray>to browse"
    actions:
      any:
        - "[sound] $click"
        - "[open] gui:browsing/global filter:category:gear"
    item-flags:
      - HIDE_ATTRIBUTES

  category-foods:
    slots: 21
    material: COOKED_BEEF
    display-name: "<aqua><bold>Foods</bold>"
    lore:
      - "<dark_gray>Provisions"
      - " "
      - "<gray>Food, potions and other"
      - "<gray>consumable items."
      - " "
      - "<aqua>Click <gray>to browse"
    actions:
      any:
        - "[sound] $click"
        - "[open] gui:browsing/global filter:category:foods"

  category-blocks:
    slots: 23
    material: COBBLESTONE
    display-name: "<aqua><bold>Blocks</bold>"
    lore:
      - "<dark_gray>Materials"
      - " "
      - "<gray>Bricks, concrete, planks and"
      - "<gray>general building materials."
      - " "
      - "<aqua>Click <gray>to browse"
    actions:
      any:
        - "[sound] $click"
        - "[open] gui:browsing/global filter:category:blocks"

  category-misc:
    slots: 25
    material: ENDER_PEARL
    display-name: "<aqua><bold>Miscellaneous</bold>"
    lore:
      - "<dark_gray>Others"
      - " "
      - "<gray>Spawn eggs, utilities and other"
      - "<gray>farming supplies."
      - " "
      - "<aqua>Click <gray>to browse"
    actions:
      any:
        - "[sound] $click"
        - "[open] gui:browsing/global filter:category:misc"