# AirAuctions - target/active.yml
# Docs: https://airdevelopment.gitbook.io/docs/

settings:
  title: "<gradient:#5AD1F2:#736EFE><bold>%seller%'s Listings</bold></gradient> <dark_gray>- Page %page%/%pages%"
  rows: 5

# --------------------------------------------------
# LAYOUT
# Controls how listings are displayed.
# --------------------------------------------------
layout:
  filters:
    # Filters excluded from this GUI.
    excluded: [] # category, type, economy

    format:
      category: # %filter_CATEGORY_list%
        selected: "<aqua>> <white>%name% <gray>(%count%)"
        unselected: "<dark_gray>  %name% <gray>(%count%)"
      type: # %filter_TYPE_list%
        selected: "<aqua>> <white>%name% <gray>(%count%)"
        unselected: "<dark_gray>  %name% <gray>(%count%)"
      economy: # %filter_ECONOMY_list%
        selected: "<aqua>> <white>%name% <gray>(%count%)"
        unselected: "<dark_gray>  %name% <gray>(%count%)"

  sorts:
    # Sort options excluded from this GUI.
    excluded: [] # active

    format:
      active: # %sort_ACTIVE_list%
        selected: "<aqua>> <white>%name%"
        unselected: "<dark_gray>  %name%"

  # Slots where listings are rendered.
  listing-slots: [9-35]

  # How each listing is rendered inside listing-slots.
  listing:
    template: row-active

  # Slots where available listing slots are rendered.
  # (based on limit permission + extra slots)
  #
  # Note:
  #   If target is offline, it will fall back to max-active + extra slots.
  #   Recommended to keep this disabled to avoid inconsistency.
  available-slots:
    enabled: false
    material: LIME_STAINED_GLASS_PANE
    display-name: "<green><bold>Available Slot"
    lore:
      - "<gray>%seller% has a free slot to list a new item."

# --------------------------------------------------
# ITEMS
# Define the static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [1-2, 6-8, 37-38, 42-43]

  no-listings:
    template: no-listings
    slots: 22

  # --- Header ---
  back:
    slots: 0
    material: DARK_OAK_DOOR
    display-name: "<white><bold>Back</bold>"
    lore:
      - "<gray>Return to Marketplace."
    actions:
      any:
        - "[open] gui:browsing/global page:1"
        - "[sound] $click"

  filter-category:
    template: filter-category
    slots: 3

  filter-type:
    template: filter-type
    slots: 4

  filter-economy:
    template: filter-economy
    slots: 5

  # --- Footer ---
  next-page:
    template: next-page
    slots: 44

  previous-page:
    template: previous-page
    slots: 36

  info:
    template: info-button
    slots: 40
    material: head-%seller%

  search:
    template: search-button
    slots: 39

  sort:
    template: sort-active
    slots: 41