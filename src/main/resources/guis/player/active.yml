# AirAuctions - player/active.yml
# Docs: https://airdevelopment.gitbook.io/docs/

settings:
  title: "<gradient:#5AD1F2:#736EFE><bold>Your Listings</bold></gradient> <dark_gray>- Page %page%/%pages%"
  rows: 6

# --------------------------------------------------
# LAYOUT
# Controls how listings are displayed.
# --------------------------------------------------
layout:
  filters:
    # Filters excluded from this GUI.
    excluded: [] # category, type, economy

    format:
      category: # %filter_CATEGORY_list%
        selected: "<aqua>> <white>%name% <gray>(%count%)"
        unselected: "<dark_gray>  %name% <gray>(%count%)"
      type: # %filter_TYPE_list%
        selected: "<aqua>> <white>%name% <gray>(%count%)"
        unselected: "<dark_gray>  %name% <gray>(%count%)"
      economy: # %filter_ECONOMY_list%
        selected: "<aqua>> <white>%name% <gray>(%count%)"
        unselected: "<dark_gray>  %name% <gray>(%count%)"

  sorts:
    # Sort options excluded from this GUI.
    excluded: [] # active

    format:
      active: # %sort_ACTIVE_list%
        selected: "<aqua>> <white>%name%"
        unselected: "<dark_gray>  %name%"

  # Slots where listings are rendered.
  listing-slots: [10-16, 19-25, 28-34]

  # How each listing is rendered inside listing-slots.
  listing:
    template: row-active

  # Slots where available listing slots are rendered
  # (based on limit permission + extra slots)
  available-slots:
    enabled: true
    material: LIME_STAINED_GLASS_PANE
    display-name: "<green><bold>Available Slot"
    lore:
      - "<gray>You have a free slot to list a new item."

# --------------------------------------------------
# ITEMS
# Define the static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [1-7, 9, 17, 27, 35-44]

  blocked-slot:
    slots: [10-16, 19-25, 28-34]
    material: RED_STAINED_GLASS_PANE
    display-name: "<red><bold>Blocked Slot</bold>"
    lore:
      - "<gray>You have no access to list more items."

  # --- Header ---
  back:
    slots: 0
    material: OAK_DOOR
    display-name: "<white><bold>Back</bold>"
    lore:
      - "<gray>Return to the Marketplace."
    actions:
      any:
        - "[open] gui:browsing/global restore:<page:current>"
        - "[sound] $click"

  close:
    template: close-button
    slots: 8

  # --- Navigation ---
  previous-page:
    template: previous-page
    slots: 18

  next-page:
    template: next-page
    slots: 26

  # --- Footer ---
  expired:
    slots: 45
    material: CLOCK
    display-name: "<red><bold>Expired Listings</bold>"
    lore:
      - "<dark_gray>Management"
      - " "
      - "<gray>View and manage your expired listings."
      - " "
      - "<white>Click <gray>to open"
    actions:
      any:
        - "[sound] $click"
        - "[open] gui:player/expired page:1 restore:<page:current>"

  history:
    slots: 46
    material: BOOK
    display-name: "<gold><bold>History</bold>"
    lore:
      - "<dark_gray>Transaction Logs"
      - " "
      - "<gray>View your past sales and purchases."
      - " "
      - "<gold>Click <gray>to open"
    actions:
      any:
        - "[sound] $click"
        - "[open] gui:player/history page:1 restore:<page:current>"

  storage:
    slots: 47
    material: CHEST_MINECART
    display-name: "<gold><bold>Storage</bold>"
    lore:
      - "<dark_gray>Unclaimed items"
      - " "
      - "<gray>View and manage your unclaimed items."
      - " "
      - "<gold>Click <gray>to open"
    actions:
      any:
        - "[sound] $click"
        - "[open] gui:player/storage page:1 restore:<page:current>"

  search:
    template: search-button
    slots: 48

  refresh:
    template: refresh-button
    slots: 49

  sort-active:
    template: sort-active
    slots: 50

  filter-category:
    template: filter-category
    slots: 51

  filter-type:
    template: filter-type
    slots: 52

  filter-economy:
    template: filter-economy
    slots: 53