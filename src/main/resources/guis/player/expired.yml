# AirAuctions - player/expired.yml
# Docs: https://airdevelopment.gitbook.io/docs/

settings:
  title: "<gradient:#5AD1F2:#736EFE><bold>Expired Listings</bold></gradient> <dark_gray>- Page %page%/%pages%"
  rows: 5

# --------------------------------------------------
# LAYOUT
# Controls how listings are displayed.
# --------------------------------------------------
layout:
  filters:
    # Filters excluded from this GUI.
    excluded: [category, type, economy]

    format:
      category: # %filter_CATEGORY_list%
        selected: "<aqua>> <white>%name% <gray>(%count%)"
        unselected: "<dark_gray>  %name% <gray>(%count%)"
      type: # %filter_TYPE_list%
        selected: "<aqua>> <white>%name% <gray>(%count%)"
        unselected: "<dark_gray>  %name% <gray>(%count%)"
      economy: # %filter_ECONOMY_list%
        selected: "<aqua>> <white>%name% <gray>(%count%)"
        unselected: "<dark_gray>  %name% <gray>(%count%)"

  sorts:
    # Sort options excluded from this GUI.
    excluded: [] # expired

    format:
      unclaimed: # %sort_UNCLAIMED_list%
        selected: "<aqua>> <white>%name%"
        unselected: "<dark_gray>  %name%"

  # Slots where listings are rendered.
  listing-slots: [9-35]

  # How each listing is rendered inside listing-slots.
  listing:
    template: row-expired

# --------------------------------------------------
# ITEMS
# Define the static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [1-7, 37-38, 43]

  no-listings:
    template: no-listings
    slots: 22

  # --- Header ---
  back:
    slots: 0
    material: DARK_OAK_DOOR
    display-name: "<white><bold>Back</bold>"
    lore:
      - "<gray>Return to Marketplace."
    actions:
      any:
        - "[open] gui:browsing/global"
        - "[sound] $click"

  switch-listings:
    template: switch-listings
    slots: 8
    lore:
      - "<dark_gray>Management"
      - " "
      - "<gray>View and manage your listings."
      - " "
      - "  <gray>Left-Click <dark_gray>- Active Listings"
      - "<white>> Right-Click <gray>- Expired Listings"
      - "  <gray>Shift-Left <dark_gray>- Storage"
      - "  <gray>Shift-Right <dark_gray>- Transactions"

  # --- Footer ---
  next-page:
    template: next-page
    slots: 44

  previous-page:
    template: previous-page
    slots: 36

  info:
    template: info-button
    slots: 40
    material: head-%player%

  search:
    template: search-button
    slots: 39

  sort:
    template: sort-unclaimed
    slots: 41

  claim-all:
    slots: 42
    priority:
      - conditions:
          - "%total% == 0"
        material: CAULDRON
        display-name: "<white><bold>Claim All</bold>"
        lore:
          - "<dark_gray>Bulk Action"
          - " "
          - "<red>You have nothing to claim yet."
      - conditions:
          - "%total% > 0"
        material: CAULDRON
        display-name: "<white><bold>Claim All</bold>"
        lore:
          - "<dark_gray>Bulk Action"
          - " "
          - "<gray>Claim all of your expired listings at once."
          - " "
          - "<white>Click <gray>to claim all"
        actions:
          any:
            - "=can:claim [sound] $click"
            - "[confirm:claim_all]"