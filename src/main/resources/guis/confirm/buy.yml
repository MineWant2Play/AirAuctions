# AirAuctions - confirm/buy.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# contexts:
#   Override any combination of fields for a specific source GUI.
#   Key = the GUI id that triggered the confirmation (e.g. target/active).

settings:
  title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Purchase</bold></gradient>"
  rows: 3

# --------------------------------------------------
# LAYOUT
# Controls how the listing is displayed.
# --------------------------------------------------
layout:
  # Slots where targeted listing is rendered.
  listing-slots: 13

  # How the targeted listing is rendered inside listing-slots.
  listing:
    template: card-active

# --------------------------------------------------
# ITEMS (base - used when no context overrides items)
# Define the static items rendered in this GUI.
# --------------------------------------------------
items:
  confirm:
    slots: 11
    material: LIME_STAINED_GLASS_PANE
    display-name: "<green><bold>Confirm</bold>"
    lore:
      - "<gray>Click to confirm this purchase for %price%."
    actions:
      any:
        - "[buy]"
        - "=can:buy =is:valid [sound] $success"
        - "[open] context:true"

  cancel:
    slots: 15
    material: RED_STAINED_GLASS_PANE
    display-name: "<red><bold>Cancel</bold>"
    lore:
      - "<gray>Click to cancel and go back."
    actions:
      any:
        - "[open] context:true"
        - "[sound] $deny"

# --------------------------------------------------
# GUI CONTEXTS
# Override any field based on which GUI triggered the overlay.
# Keys must exactly match the source GUI id.
# --------------------------------------------------
contexts:
  target/active:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Purchase</bold></gradient> <dark_gray>- <white>%seller%'s Listing"

    # The rest is inherited from the base config above unless overridden here.

  target/active|browsing/search:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Purchase</bold></gradient> <dark_gray>- <white>%seller%'s Listing <dark_gray>- <white>\"%query%\""

  browsing/search:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Purchase</bold></gradient> <dark_gray>- <white>\"%query%\""