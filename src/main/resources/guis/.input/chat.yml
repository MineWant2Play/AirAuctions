# AirAuctions - input/chat.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# -----------------------------------------------
# GLOBAL
# Applies to all contexts unless overridden.
# -----------------------------------------------
cancel-key: "cancel"
on-cancel: BACK   # BACK = reopen previous GUI | CLOSE = do nothing

# -----------------------------------------------
# CONTEXTS
# Each action that opens a chat input names a context.
# cancel-key and on-cancel can be overridden per context.
# -----------------------------------------------
contexts:
  search:
    # cancel-key: "exit"
    # on-cancel: CLOSE
    prompt: "<ref:prefix> <gray>Type an item name to search, or type <red>%cancel_key% <gray>to go back."

  quantity:
    prompt: "<ref:prefix> <gray>Enter the quantity you wish to purchase, or type <red>%cancel_key% <gray>to go back."

  bid:
    prompt: "<ref:prefix> <gray>Enter your bid amount, or type <red>%cancel_key% <gray>to go back."

  price:
    prompt: "<ref:prefix> <gray>Enter a price, or type <red>%cancel_key% <gray>to go back."

  initial-price:
    prompt: "<ref:prefix> <gray>Enter an initial price, or type <red>%cancel_key% <gray>to go back."